name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-companion:
    name: Build Go Companion Daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: companion/go.sum

      - name: Run Tests
        working-directory: companion
        run: go test -v ./...

      - name: Build Multiplatform Binaries
        working-directory: companion
        run: |
          mkdir -p ../dist
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.Version=1.0.0" -o ../dist/mircode-linux-amd64 ./cmd/mircode
          tar -czvf ../dist/mircode-v1.0.0-linux-amd64.tar.gz -C ../dist mircode-linux-amd64
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.Version=1.0.0" -o ../dist/mircode-linux-arm64 ./cmd/mircode
          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.Version=1.0.0" -o ../dist/mircode-windows-amd64.exe ./cmd/mircode
          # macOS ARM64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.Version=1.0.0" -o ../dist/mircode-darwin-arm64 ./cmd/mircode

      - name: Upload Companion Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: companion-binaries
          path: |
            dist/mircode-v1.0.0-linux-amd64.tar.gz
            dist/mircode-windows-amd64.exe
            dist/mircode-darwin-arm64
            dist/mircode-linux-arm64

  build-arch:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Build Tools
        run: |
          pacman -Syu --noconfirm base-devel git go

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd archlinux && makepkg -f --nodeps"

      - name: Upload Arch Package
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-package
          path: archlinux/*.pkg.tar.zst

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android App
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename & Upload APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MirCode-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mircode-apk
          path: MirCode-v1.0.0.apk

  release:
    name: Publish GitHub Release
    needs: [build-companion, build-arch, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Organize Release Files
        run: |
          mkdir -p release-files
          find all-artifacts -type f \( -name "*.apk" -o -name "*.pkg.tar.zst" -o -name "*.tar.gz" -o -name "*.exe" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
