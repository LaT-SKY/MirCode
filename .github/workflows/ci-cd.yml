name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-companion:
    name: Build Go Companion Daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: companion/go.sum

      - name: Run Tests
        working-directory: companion
        run: go test -v ./...

      - name: Build Multiplatform Binaries
        working-directory: companion
        run: |
          mkdir -p ../dist
          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.Version=1.0.0" -o ../dist/mircode-linux-amd64 ./cmd/mircode
          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.Version=1.0.0" -o ../dist/mircode-linux-arm64 ./cmd/mircode
          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.Version=1.0.0" -o ../dist/mircode-windows-amd64.exe ./cmd/mircode
          # macOS ARM64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.Version=1.0.0" -o ../dist/mircode-darwin-arm64 ./cmd/mircode

      - name: Upload Companion Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: companion-binaries
          path: dist/*

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename & Upload APK
        working-directory: android/app/build/outputs/apk/release
        run: |
          cp app-release.apk ../../../../../MirCode-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mircode-apk
          path: MirCode-v1.0.0.apk

  release:
    name: Publish GitHub Release
    needs: [build-companion, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            companion-binaries/*
            mircode-apk/*
            archlinux/*.pkg.tar.zst
          generate_release_notes: true
